# obsidian-vault-setup configuration — EXAMPLE.
#
# Copy to ~/.config/obsidian-vault-setup/config.yaml (`obsidian-vault-setup init-config` does it), or point
# $OBSIDIAN_VAULT_SETUP_CONFIG at any file with this shape. Edit freely: this file is only a starting point.
#
# The model: every NEW vault gets every plugin with `roster: true` installed. The vault's PROFILE decides
# which of them start switched on. After that you only toggle plugins on and off in
# Settings -> Community plugins; you never install anything by hand. Settings below are applied when the
# plugin is installed, so a plugin you switch on later already has them.

schema_version: 1

# --------------------------------------------------------------------------------------------------
# always_on: plugins switched ON in every vault this tool sets up, whatever the profile. The one place
# for a plugin that is really a preference of yours rather than of a kind of vault. Each id must be in
# `plugins:` below. Default: Window Title, so every window (and the macOS Window menu, the Dock, the
# task switcher) reads "<vault> · <note>" instead of Obsidian's "<note> - <vault> - Obsidian 1.x".
# --------------------------------------------------------------------------------------------------
always_on: [window-title]

# --------------------------------------------------------------------------------------------------
# core_settings: settings of Obsidian's CORE plugins (Settings -> Core plugins), applied to EVERY vault
# this tool sets up (`new`, `open`, `apply`). Keys are core plugin ids (`switcher`, `file-explorer`, …)
# and the option names Obsidian stores in `.obsidian/<id>.json`; Obsidian writes that file itself.
# A profile may carry its own `core_settings:` block, which adds to or overrides these key by key.
# --------------------------------------------------------------------------------------------------
core_settings:
  switcher:                       # Quick switcher (Cmd+O)
    showAllFileTypes: true        # off by default in Obsidian, which hides .base, .canvas and other
                                  # non-markdown files from Cmd+O; a Base you built should be two keystrokes away

# --------------------------------------------------------------------------------------------------
# bookmark_bases: bookmark every Obsidian Base (*.base file) in the vault, so each is one click away in
# the Bookmarks pane. Idempotent (existing bookmarks are kept); applied on `new`, `open` and `apply`, so a
# Base created later is bookmarked on the next pass. A profile may set its own `bookmark_bases:`.
# --------------------------------------------------------------------------------------------------
bookmark_bases: true

# --------------------------------------------------------------------------------------------------
# excluded_files: Obsidian's Excluded files (Settings -> Files and links), applied to EVERY vault this tool
# sets up, so build output and caches stay out of search, graph, the quick switcher and link suggestions.
# A bare name means a folder of that name at any depth (compiled to the regex /(^|\/)name\//); an entry
# with a `/` in it is a vault-relative path prefix; `/…/` is a regular expression, passed as written.
# Existing entries in the vault are kept. A profile may carry its own `excluded_files:` list, which adds.
# --------------------------------------------------------------------------------------------------
excluded_files: [node_modules, .venv, dist, build, __pycache__, .pytest_cache, working-logs]

# --------------------------------------------------------------------------------------------------
# profiles: named sets of plugins to switch ON. `obsidian-new-vault --profile <name>`; the default is
# core-only. A profile may only name plugins listed under `plugins:` below.
# --------------------------------------------------------------------------------------------------
profiles:
  core-only:
    description: Nothing switched on. The roster is still installed, switched off, ready to toggle.
    plugins: []

  review:
    description: Review documents (e.g. AI-written drafts) as CriticMarkup suggestions you accept or reject.
    plugins: [track-changes]

  review-repo:
    description: A git repository you review in Obsidian and commit from inside Obsidian.
    plugins: [track-changes, obsidian-git]

  knowledge-base:
    description: A long-lived notes vault where links must stay intact as files move.
    plugins:
      - obsidian-dangling-links
      - persistent-links
      - external-rename-handler
      - automatic-table-of-contents
      - obsidian-advanced-uri

# --------------------------------------------------------------------------------------------------
# plugins: the roster. Keys are community-directory plugin ids.
#   name              display name (for your reference)
#   expected_author   checked after install: plugin ids are NOT unique across the ecosystem, and a
#                     same-id plugin by another author is switched off and reported instead of used
#   source            directory (installed with `obsidian plugin:install`) | github (needs `install: brat`)
#   install           optional: brat — install a GitHub-only plugin through the BRAT plugin, with `repo`
#   repo              owner/repo (required for install: brat; informational otherwise)
#   roster            true = installed (switched off unless a profile enables it) in every new vault
#   settings          optional: values merged into the plugin's own settings and saved by the plugin
#   used_for          optional: why you have it
# --------------------------------------------------------------------------------------------------
plugins:
  window-title:
    name: Window Title
    expected_author: gorky               # manifest.json author (the GitHub account is igorhajduk)
    repo: igorhajduk/obsidian-window-title
    source: directory
    roster: true
    used_for: Window title as "<vault> · <note>" in every window, pop-outs included; survives renames and tab switches.
    settings:
      template: "{{vault}} · {{title}}"  # elements: vault, title, filename, basename, folder, filepath, frontmatter["key"]
    # This plugin keeps no `settings` + `saveSettings()` pair, so the tool calls its own API instead
    # (undocumented-api `plugin-settings-hook`): `p` is the loaded plugin, `s` the settings above.
    settings_save: "p.setTemplate(s.template); p.flushSave(); return 'OK '+JSON.stringify({template: p.template});"

  track-changes:
    name: Track Changes
    expected_author: Phil Baum
    repo: philphilphil/obsidian-track-changes
    source: directory
    roster: true
    used_for: Accept / reject / reply to CriticMarkup suggestions in a side panel.
    settings:
      localAuthorName: Your Name        # your marks vs. anyone else's are told apart by author

  obsidian-git:
    name: Git
    expected_author: Vinzent
    repo: vinzent03/obsidian-git
    source: directory
    roster: true
    used_for: Commit, pull and push a vault that is a git repository, from inside Obsidian.
    settings: {}                        # defaults keep every automatic commit/push/pull interval off

  obsidian-advanced-uri:
    name: Advanced URI
    expected_author: Vinzent
    repo: vinzent03/obsidian-advanced-uri
    source: directory
    roster: true
    used_for: obsidian://adv-uri links that open headings, run commands or write to notes.

  obsidian-dangling-links:
    name: Dangling links
    expected_author: Graydon Hoare
    repo: graydon/obsidian-dangling-links
    source: directory
    roster: true

  persistent-links:
    name: Persistent Links
    expected_author: Ivan Lednev
    repo: ivan-lednev/obsidian-persistent-links
    source: directory
    roster: true

  external-rename-handler:
    name: External Rename Handler
    expected_author: mnaoumov
    repo: mnaoumov/obsidian-external-rename-handler
    source: directory
    roster: true
    used_for: Keeps links intact when files are renamed outside Obsidian (git, scripts, agents).

  automatic-table-of-contents:
    name: Automatic Table Of Contents
    expected_author: Johan Satgé
    repo: johansatge/obsidian-automatic-table-of-contents
    source: directory
    roster: true

  unhide:
    name: Unhide (formerly Show Hidden Files)
    expected_author: polyipseity
    repo: polyipseity/obsidian-unhide
    source: directory
    roster: true
    used_for: Shows dotfiles (.github/, .claude/) in a repository vault.

  # Example of a GitHub-only plugin, installed through BRAT from inside Obsidian (left off the roster).
  # some-beta-plugin:
  #   name: Some Beta Plugin
  #   expected_author: someone
  #   repo: someone/obsidian-some-beta-plugin
  #   source: github
  #   install: brat
  #   roster: true

# --------------------------------------------------------------------------------------------------
# banned: never installed or enabled; the tool refuses to work on a vault where one is switched on.
#   reason   shown when the tool refuses
# --------------------------------------------------------------------------------------------------
banned:
  inkling:
    name: Inkling
    expected_author: Andrew Brož
    reason: >-
      Example entry. In the author's use, Inkling and Track Changes active together on the same notes
      produced runaway nested CriticMarkup in suggesting mode. Remove this entry if you use Inkling alone.
